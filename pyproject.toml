[project]
name = "introduction-to-dsl-compilers"
version = "0.1.0"
description = "Course template for 'Introduction to DSL compilers'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["textX[cli]>=4.0,<5", "jinja2>=3.1", "fsm-lang", "atm-lang"]

# Topic 7: two textX plugins installed from the repository, so that `textx generate`
# knows the traffic-light language (examples, step 7) and the ATM language (the homework)
# right after `uv sync`. Editable: code changes apply at once; after editing a plugin's
# pyproject.toml run `uv sync --reinstall-package <name>`.
[tool.uv.sources]
fsm-lang = { path = "topic-7/examples/step-7-generator-plugin", editable = true }
atm-lang = { path = "topic-7/plugin", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: common bug patterns,
# UP: outdated syntax, SIM: needless complexity
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = [
    "topic-1",
    "topic-2",
    "topic-3",
    "topic-4",
    "topic-5",
    "topic-6",
    "topic-7",
]
testpaths = [
    "topic-1",
    "topic-2",
    "topic-3",
    "topic-4",
    "topic-5",
    "topic-6",
    "topic-7",
]
