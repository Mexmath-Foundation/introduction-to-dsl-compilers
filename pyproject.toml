[project]
name = "introduction-to-dsl-compilers"
version = "0.1.0"
description = "Course template for 'Introduction to DSL compilers'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: common bug patterns,
# UP: outdated syntax, SIM: needless complexity
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = [
    "topic-1",
    "topic-2",
    "topic-3",
]
testpaths = [
    "topic-1",
    "topic-2",
    "topic-3",
]
