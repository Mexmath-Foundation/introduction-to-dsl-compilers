name: CI

on:
  pull_request:
  push:
    branches:
      - "topic-*"

jobs:
  test:
    name: Run tests for the topic matching the branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Determine the topic from the branch name
        id: topic
        env:
          # For pull requests github.ref_name is "<PR>/merge",
          # so take the source branch (head_ref) instead.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ ! "$BRANCH" =~ ^topic-[0-9]+$ ]]; then
            echo "::error::Branch '$BRANCH' does not follow the 'topic-N' naming convention (e.g. 'topic-1'). Rename the branch and push again."
            exit 1
          fi
          if [[ ! -d "$BRANCH" ]]; then
            echo "::error::Branch '$BRANCH' matches the naming convention, but the folder '$BRANCH' does not exist in the repository."
            exit 1
          fi
          echo "topic=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Run tests for ${{ steps.topic.outputs.topic }}
        run: uv run pytest "${{ steps.topic.outputs.topic }}"
